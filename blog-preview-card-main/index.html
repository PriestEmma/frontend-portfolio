<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hero">
      <article class="card">
        <img src="./assets/images/illustration-article.svg" alt="image" />

        <p class="highlight">Learning</p>

        <p class="publish">Published 21 Dec 2023</p>

        <h2 class="header">HTML & CSS foundations</h2>

        <p class="text">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>

        <div class="info">
          <img src="./assets/images/image-avatar.webp" alt="image 2" />
          <h3 class="info-name">Greg Hooper</h3>
        </div>
      </article>
    </main>
  </body>
</html>
